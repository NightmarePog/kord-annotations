name: Release
run-name: Release v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the v prefix
        required: true
        type: string
      retryPluginPortalOnly:
        description: Skip Maven Central when retrying a release that reached Central
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    environment: release
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RETRY_PLUGIN_PORTAL_ONLY: ${{ inputs.retryPluginPortalOnly }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - name: Inspect release
        id: version
        run: .github/scripts/inspect-release.sh
      - name: Validate release
        if: steps.version.outputs.tag_exists == 'false'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: .github/scripts/run-gradle-release.sh validateRelease
      - name: Build and test
        run: .github/scripts/run-gradle-release.sh clean build
      - name: Build release repository
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
        run: .github/scripts/run-gradle-release.sh releaseRepositoryChecksum
      - name: Publish Maven Central
        if: steps.version.outputs.tag_exists == 'false' && !inputs.retryPluginPortalOnly
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
        run: .github/scripts/run-gradle-release.sh publishToMavenCentral
      - name: Publish Gradle plugin
        if: steps.version.outputs.tag_exists == 'false'
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: .github/scripts/run-gradle-release.sh :gradle-plugin:publishPlugins
      - name: Finalize GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_EXISTS: ${{ steps.version.outputs.tag_exists }}
        run: .github/scripts/finalize-release.sh
